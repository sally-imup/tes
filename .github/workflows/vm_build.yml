name: Build Termux VM (embedded X11)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y bison flex gperf pkg-config python3

      - name: Fetch embedded X server sources
        run: bash .github/scripts/fetch-lorie-submodules.sh

      - name: Build debug APK
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "0"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-vm-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
